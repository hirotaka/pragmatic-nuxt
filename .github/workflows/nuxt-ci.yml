name: Nuxt CI

on:
  push:
    branches:
      - main
    paths:
      - "apps/bulletproof-nuxt/**"
      - "apps/reference/bulletproof-nuxt-veevalidate/**"
      - "apps/reference/bulletproof-nuxt-tanstack-form/**"
      - "apps/reference/bulletproof-nuxt-formwerk/**"
      - "apps/reference/bulletproof-nuxt-pinia-colada/**"
      - "apps/reference/bulletproof-nuxt-original-ui/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - "pnpm-workspace.yaml"
      - ".github/workflows/nuxt-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/bulletproof-nuxt/**"
      - "apps/reference/bulletproof-nuxt-veevalidate/**"
      - "apps/reference/bulletproof-nuxt-tanstack-form/**"
      - "apps/reference/bulletproof-nuxt-formwerk/**"
      - "apps/reference/bulletproof-nuxt-pinia-colada/**"
      - "apps/reference/bulletproof-nuxt-original-ui/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - "pnpm-workspace.yaml"
      - ".github/workflows/nuxt-ci.yml"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  all-cli-check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: bulletproof-nuxt
            app_slug: bulletproof-nuxt
          - app: reference/bulletproof-nuxt-veevalidate
            app_slug: bulletproof-nuxt-veevalidate
          - app: reference/bulletproof-nuxt-tanstack-form
            app_slug: bulletproof-nuxt-tanstack-form
          - app: reference/bulletproof-nuxt-formwerk
            app_slug: bulletproof-nuxt-formwerk
          - app: reference/bulletproof-nuxt-pinia-colada
            app_slug: bulletproof-nuxt-pinia-colada
          - app: reference/bulletproof-nuxt-original-ui
            app_slug: bulletproof-nuxt-original-ui
    defaults:
      run:
        working-directory: ./apps/${{ matrix.app }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build application
        run: pnpm build
      - name: Run tests
        run: pnpm test:unit
      - name: Run linter
        run: pnpm run lint
      - name: Check types
        run: pnpm exec nuxi typecheck
  e2e:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: bulletproof-nuxt
            app_slug: bulletproof-nuxt
          - app: reference/bulletproof-nuxt-veevalidate
            app_slug: bulletproof-nuxt-veevalidate
          - app: reference/bulletproof-nuxt-tanstack-form
            app_slug: bulletproof-nuxt-tanstack-form
          - app: reference/bulletproof-nuxt-formwerk
            app_slug: bulletproof-nuxt-formwerk
          - app: reference/bulletproof-nuxt-pinia-colada
            app_slug: bulletproof-nuxt-pinia-colada
          - app: reference/bulletproof-nuxt-original-ui
            app_slug: bulletproof-nuxt-original-ui
    defaults:
      run:
        working-directory: ./apps/${{ matrix.app }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps
      - name: Run Playwright tests
        run: pnpm test:e2e:ci
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.app_slug }}
          path: apps/${{ matrix.app }}/playwright/playwright-report/
          retention-days: 30
          if-no-files-found: ignore
