name: Manual Database Reset
on:
  workflow_dispatch:
    inputs:
      database:
        description: "Target database"
        required: true
        type: choice
        options:
          - production
          - preview
permissions:
  contents: read
env:
jobs:
  reset-database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./apps/bulletproof-nuxt
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate database target
        env:
          TARGET: ${{ inputs.database }}
        shell: bash
        run: |
          case "$TARGET" in
            production|preview) ;;
            *) echo "Unsupported database target" >&2; exit 1 ;;
          esac
      - name: Validate remote D1 identity
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TARGET: ${{ inputs.database }}
        shell: bash
        run: |
          set -euo pipefail

          case "$TARGET" in
            production)
              database_name="bulletproof-nuxt"
              expected_id="d51277bf-fa2b-4f23-a140-edafa3260319"
              ;;
            preview)
              database_name="bulletproof-nuxt-preview"
              expected_id="e4519eb7-fe8b-4fa4-8f35-a8f33dc5eda0"
              ;;
          esac

          actual_id="$(pnpm exec wrangler d1 list --json | jq -r --arg name "$database_name" 'first(.[] | select(.name == $name) | .uuid) // empty')"
          if [[ "$actual_id" != "$expected_id" ]]; then
            echo "Refusing to clear $database_name: expected D1 ID $expected_id, found ${actual_id:-none}." >&2
            exit 1
          fi

          echo "Verified $database_name resolves to D1 ID $actual_id."
      - name: Clear production database
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.database == 'production'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Clearing production database..."
          pnpm db:clear:d1
          echo "Production database cleared successfully!"
      - name: Clear preview database
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.database == 'preview'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Clearing preview database..."
          pnpm db:clear:d1:preview
          echo "Preview database cleared successfully!"
